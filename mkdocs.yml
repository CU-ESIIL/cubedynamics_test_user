site_name: "CubeDynamics User Testing"
site_description: "Independent naive-user acceptance testing of CubeDynamics through public documentation and installed-package behavior."
site_url: "https://cu-esiil.github.io/cubedynamics_test_user/"

repo_name: "CU-ESIIL/cubedynamics_test_user"
repo_url: "https://github.com/CU-ESIIL/cubedynamics_test_user"
edit_uri: "edit/main/docs/"

# Theme templates are build inputs, not public website pages.
exclude_docs: |
  /overrides/

nav:
  - User testing:
      - Home: index.md
      - Testing workflow: examples.md
      - Evidence and prompt log: evidence.md
      - Project notes: project.md

theme:
  name: material
  logo: assets/esiil_content/esiil_oasis_logo.png
  favicon: assets/esiil_content/favicon.ico
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search
